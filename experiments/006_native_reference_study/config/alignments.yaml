# Lyric-to-note alignment worksheet for the 32 selected study items.
# Edit ONLY this file. Do not edit the MN-PHON-250 manifest.
#
# For each word, decide the sung units (syllable-like cuts), not melody.
# Each unit already has one MIDI 60 <NOTE_2>. Do not change the notes.
#
# How to split a word, e.g. бүлэг -> бү | лэг:
#   alignment_complexity: multi_unit
#   lyric_units:
#     - text: бү
#       source_span: [0, 2]
#       notes: [{midi_pitch: 60, note_value: "<NOTE_2>"}]
#     - text: лэг
#       source_span: [2, 5]
#       notes: [{midi_pitch: 60, note_value: "<NOTE_2>"}]
#
# Rules:
#   - source_span is [start, end) in Unicode characters
#   - units must be contiguous, no overlap, start at 0, end at len(word)
#   - unit text must equal source_text[start:end]
#   - leave one-unit words as single_unit
#   - MNPHON_161 хүүхэд MUST stay хүү | хэд
#   - when you accept a row:
#       reviewer_pseudonym: developer_01
#       review_date: "YYYY-MM-DD"
#       review_status: approved
#       alignment_note: <short non-phonetic reason>
#
# Then:
#   python scripts/mn/validate_study_alignments.py experiments/006_native_reference_study/config/alignments.yaml

