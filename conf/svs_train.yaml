# ================================================================
# VocalRender SVS training configuration
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nproc_per_node=4 \
#     scripts/train_vocalrender_svs.py --config_path conf/svs_train.yaml
#
# Any key can be overridden on the command line with dotted paths:
#   --set train.batch_size=32 --set runtime.save_path=checkpoints/run2
# ================================================================

# ================================================================
# Model Configuration
# ================================================================

# Pretrained VoxCPM2 checkpoint directory (config.json + weights + tokenizer).
pretrained_path: pretrained_models/VoxCPM2

# ================================================================
# Dataset Configuration
# ================================================================

# Output directory of scripts/preprocess_svs_data.py (Arrow shards).
preprocessed_data_path: data/preprocessed

# Datasets used for training / validation, selected by the `dataset`
# field stamped on each sample during preprocessing. Comment out
# train_datasets to train on everything except val_datasets.
train_datasets: ["muse", "muchin", "songformdb", "opensinger", "m4singer", "gtsinger"]

# Optional per-dataset repetition factor (rebalances small datasets).
# dataset_upsample:
#   m4singer: 5
#   gtsinger: 5

# Opencpop is included in CrawlSinger-OS as the held-out validation set.
val_datasets: ["opencpop"]
val_samples: 0

sample_rate: 48000

# ================================================================
# Training Parameters
# ================================================================

seed: 42
train_precision: "amp_bf16"

zero_stage: 3
fsdp_sharding_group_size: 1
activation_checkpointing: true

# Token-based dynamic batching: batch_size is the per-rank cap on samples,
# max_batch_tokens caps the padded token count per batch.
max_batch_tokens: 8192
batch_size: 64
grad_accum_steps: 1

val_max_batch_tokens: 1024
val_batch_size: 8

num_workers: 4

total_steps: 500000
log_interval: 10

valid_interval: 1000
audio_eval_interval: 5000
validate_at_step_zero: true
audio_validate_at_step_zero: false

save_interval: 10000
transient_save_interval: 2500

timing_enabled: true
per_rank_diagnostics: false

learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 5000
lr_scheduler: "inverse_sqrt"

# Number of validation samples to synthesize during audio eval
# (-1 = all), and how many of them to log to TensorBoard.
val_audio_samples: 100
val_tb_max_samples: 20
val_max_len: 200

# ================================================================
# Output Paths
# ================================================================

save_path: checkpoints/svs_v2
tensorboard: ""

# ================================================================
# Loss Configuration
# ================================================================

lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

# ================================================================
# SVS-Specific Configuration
# ================================================================

# Score-masking augmentation: with some probability, replace BPM/pitch/note
# tokens with <SVS_MASK> so the model also learns lyrics-only generation.
svs_mask_strategy:
  - global
  - paired
svs_mask_params:
  global_mask_prob: 0
  pair_mask_prob: 0
  pair_mask_rate: 0

# Probability of prepending a same-song prompt-audio clip (timbre reference)
# to the training sequence, and its maximum length in latent frames.
prompt_audio_prob: 1.0
prompt_max_frames: 50

# ================================================================
# Evaluation Metrics
# ================================================================

eval_metrics:

  singmos:
    enabled: true
    model: singmos_pro
    local_model_path: ""

  aes:
    enabled: true
    axes: ["CE", "PQ"]
    local_ckpt: ""
